apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-app
  labels:
    app: finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance
  template:
    metadata:
      labels:
        app: finance
    spec:
      containers:
      - name: finance-container
        image: ashwinr2001/financedev18may2025capstone:v1
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: finance-service
spec:
  selector:
    app: finance
  ports:
  - protocol: TCP
    port: 80
    targetPort: 2022
  type: NodePort

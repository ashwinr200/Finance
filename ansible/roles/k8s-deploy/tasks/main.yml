# roles/k8s-deploy/tasks/main.yml
- name: Copy deployment file to remote host
  copy:
    src: deployment.yaml
    dest: /home/ansadmin/deployment.yaml
    owner: ansadmin
    mode: '0644'

- name: Ensure kube config dir on master
  file:
    path: /home/ansadmin/.kube
    state: directory
    owner: ansadmin
    mode: '0700'
  when: inventory_hostname == '172.31.19.21'

- name: Copy admin.conf to ansadmin kube config on master
  become: yes
  shell: |
    cp /etc/kubernetes/admin.conf /home/ansadmin/.kube/config
    chown ansadmin:ansadmin /home/ansadmin/.kube/config
  args:
    creates: /home/ansadmin/.kube/config
  when: inventory_hostname == '172.31.19.21'

- name: Apply Kubernetes deployment
  become: yes
  become_user: ansadmin
  shell: kubectl apply -f /home/ansadmin/deployment.yaml

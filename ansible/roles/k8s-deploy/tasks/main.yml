- name: Deploy Finance app via Kubernetes
  hosts: k8s-master
  become: true
  vars:
    kube_config_path: /home/ansadmin/.kube/config

  tasks:
    - name: Copy Kubernetes deployment file to remote host
      copy:
        src: deployment.yaml
        dest: /home/ansadmin/deployment.yaml
        owner: ansadmin
        mode: '0644'

    - name: Ensure ansadmin has kube config
      shell: |
        mkdir -p /home/ansadmin/.kube
        cp -i /etc/kubernetes/admin.conf {{ kube_config_path }}
        chown ansadmin:ansadmin {{ kube_config_path }}
      args:
        creates: "{{ kube_config_path }}"

    - name: Apply Kubernetes deployment
      become_user: ansadmin
      shell: kubectl apply -f /home/ansadmin/deployment.yaml

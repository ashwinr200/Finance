- name: Copy Kubernetes deployment file to remote host
  copy:
    src: deployment.yaml
    dest: /home/ansadmin/deployment.yaml
    owner: ansadmin
    mode: '0644'

- name: Ensure ansadmin has kube config directory
  file:
    path: /home/ansadmin/.kube
    state: directory
    owner: ansadmin
    mode: '0700'

- name: Copy admin.conf to ansadmin kube config
  become: yes
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ansadmin/.kube/config
    owner: ansadmin
    group: ansadmin
    mode: '0644'
  when: ansible_facts['os_family'] == 'Debian'  # optional, adjust per your environment

- name: Apply Kubernetes deployment
  become: yes
  become_user: ansadmin
  shell: kubectl apply -f /home/ansadmin/deployment.yaml

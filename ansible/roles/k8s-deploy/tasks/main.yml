- name: Copy deployment.yaml to all nodes
  hosts: all
  become: yes
  tasks:
    - name: Copy deployment.yaml
      copy:
        src: deployment.yml
        dest: /home/ansadmin/deployment.yaml
        owner: ansadmin
        mode: '0644'

- name: Apply deployment only on master
  hosts: master
  become: yes
  tasks:
    - name: Ensure kube config directory
      file:
        path: /home/ansadmin/.kube
        state: directory
        owner: ansadmin
        mode: '0700'

    - name: Copy admin.conf to kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ansadmin/.kube/config
        owner: ansadmin
        mode: '0600'

    - name: Debug inventory hostname
      debug:
        var: inventory_hostname

    - name: Apply deployment with kubectl
      become_user: ansadmin
      shell: kubectl apply -f /home/ansadmin/deployment.yaml
